[project]
name = "sts2-advisor"
version = "0.1.0"
description = "Read-only Slay the Spire 2 decision advisor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=6.2.0",
]

[project.optional-dependencies]
model = ["torch>=2.5", "transformers>=4.57", "accelerate>=1.0"]
remote = ["openai>=1.50"]
rag = ["chromadb>=1.0"]
train = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "peft>=0.13",
  "torch>=2.5",
  "transformers>=4.57",
  "trl>=0.15",
]
dev = ["pytest>=8.0"]

[project.scripts]
sts2-advisor = "sts2_advisor.cli:main"
sts2-ingest = "sts2_advisor.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts2_advisor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
